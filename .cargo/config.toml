# Windows reserves 1 MiB of stack. The compiler's const evaluator and the
# deep-expression tests need the same room a Linux main thread has (8 MiB);
# 16 MiB covers the extra frame cost of SEH. Both lust and lust-core.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]
