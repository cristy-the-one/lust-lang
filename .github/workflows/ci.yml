name: CI

# There is no git remote yet, so this workflow has never run. It is kept
# valid (actionlint) and runs the same scripts/ci.sh gate as a dev box.
# A feature-branch commit is tested by pull_request only. push on every
# branch was starting a second full run of the same SHA.
on:
  push:
    branches: [next]
  pull_request:
  workflow_dispatch:
    inputs:
      gate_filter:
        description: 'Case-name substring, or a file of substrings (LUST_GATE_FILTER)'
        required: false
        type: string

# A new push to this ref replaces the run already going. Two full gates
# were stacking on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned tcc
        id: tcc
        uses: actions/cache@v4
        with:
          path: |
            third_party/tcc
            third_party/tinycc
          key: tcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcc.sh') }}
      - name: Build pinned tcc
        if: steps.tcc.outputs.cache-hit != 'true'
        run: scripts/build-tcc.sh
      - name: Install rustc 1.99
        run: |
          rustup set profile minimal
          rustup toolchain install 1.99.0
          rustup default 1.99.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Run CI gate
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/third_party/tcc
          LUST_GATE_FILTER: ${{ github.event.inputs.gate_filter }}
        run: bash scripts/ci.sh
      - name: Publish gate failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/publish-ci-failures.sh
      - name: Upload gate failure list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failures-linux
          path: ci-failures.txt
          if-no-files-found: ignore

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustc 1.99
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Cache pinned tcc
        id: tcc
        uses: actions/cache@v4
        with:
          path: |
            third_party/tcc
            third_party/tinycc
          key: tcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcc.ps1') }}
      - name: Build pinned tcc
        if: steps.tcc.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-tcc.ps1
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      # Same gate as Linux (scripts/ci.sh). ASan is skipped in the script
      # off Linux. Git Bash runs the scripts; the MSVC environment is loaded
      # first so cargo can link with link.exe and build mimalloc.
      - name: Run CI gate
        shell: pwsh
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/third_party/tcc
          LUST_GATE_FILTER: ${{ github.event.inputs.gate_filter }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          bash scripts/ci.sh
      - name: Publish gate failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/publish-ci-failures.sh
      - name: Upload gate failure list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failures-windows
          path: ci-failures.txt
          if-no-files-found: ignore
      - name: Pack the Windows release zip
        if: success()
        shell: pwsh
        run: ./scripts/release.ps1 -NoBuild
      - name: Upload Windows release zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lust-x86_64-windows
          path: |
            dist/*.zip
            dist/*.sha256

  # macOS is out of scope for now (tcc Mach-O, libbase.so, BSD userland).
  # The job stays in the file so it can be turned back on by deleting `if: false`.
  macos-arm64:
    if: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned tcc
        id: tcc
        uses: actions/cache@v4
        with:
          path: |
            third_party/tcc
            third_party/tinycc
          key: tcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcc.sh') }}
      - name: Build pinned tcc
        if: steps.tcc.outputs.cache-hit != 'true'
        run: scripts/build-tcc.sh
      - name: Install rustc 1.99
        run: |
          rustup set profile minimal
          rustup toolchain install 1.99.0
          rustup default 1.99.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      # Known macOS risks, tracked outside this file: tcc Mach-O output,
      # the hardcoded libbase.so name, and BSD userland differences in
      # bench scripts. This job exists to find them; expect red at first.
      - name: Run CI gate
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/third_party/tcc
        run: bash scripts/ci.sh
