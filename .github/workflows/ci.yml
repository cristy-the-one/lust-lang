name: CI

# Runs the same scripts/ci.sh gate as a dev box, on Linux, Windows and macOS.
# A feature-branch commit is tested by pull_request only. push on every
# branch was starting a second full run of the same SHA.
# Both events include next and main. The macOS job below has no `if:`,
# so it runs on those events. An `if: false` on that job skipped it for
# every pull request that did not edit this file: those runs use the
# workflow from the base branch.
on:
  push:
    branches: [next, main]
  pull_request:
    branches: [next, main]
  workflow_dispatch:
    inputs:
      gate_filter:
        description: 'Case-name substring, or a file of substrings (LUST_GATE_FILTER)'
        required: false
        type: string

# A new push to this ref replaces the run already going. Two full gates
# were stacking on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned tcc
        id: tcc
        uses: actions/cache@v4
        with:
          path: |
            third_party/tcc
            third_party/tinycc
          key: tcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcc.sh') }}
      - name: Build pinned tcc
        if: steps.tcc.outputs.cache-hit != 'true'
        run: scripts/build-tcc.sh
      - name: Install rustc 1.99
        run: |
          rustup set profile minimal
          rustup toolchain install 1.99.0
          rustup default 1.99.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Run CI gate
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/third_party/tcc
          LUST_GATE_FILTER: ${{ github.event.inputs.gate_filter }}
        run: bash scripts/ci.sh
      - name: Publish gate failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/publish-ci-failures.sh
      - name: Upload gate failure list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failures-linux
          path: ci-failures.txt
          if-no-files-found: ignore

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustc 1.99
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Cache pinned tcc
        id: tcc
        uses: actions/cache@v4
        with:
          path: |
            third_party/tcc
            third_party/tinycc
          key: tcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcc.ps1') }}
      - name: Build pinned tcc
        if: steps.tcc.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-tcc.ps1
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      # Same gate as Linux (scripts/ci.sh). ASan is skipped in the script
      # off Linux. Git Bash runs the scripts; the MSVC environment is loaded
      # first so cargo can link with link.exe and build mimalloc.
      - name: Run CI gate
        shell: pwsh
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/third_party/tcc
          LUST_GATE_FILTER: ${{ github.event.inputs.gate_filter }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          bash scripts/ci.sh
      - name: Publish gate failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/publish-ci-failures.sh
      - name: Upload gate failure list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failures-windows
          path: ci-failures.txt
          if-no-files-found: ignore
      - name: Pack the Windows release zip
        if: success()
        shell: pwsh
        run: ./scripts/release.ps1 -NoBuild
      - name: Upload Windows release zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lust-x86_64-windows
          path: |
            dist/*.zip
            dist/*.sha256

  # GitHub-hosted macOS is arm64 (macos-latest). The old macos-13
  # Intel image is retired, and this workflow has no macOS architecture
  # matrix, so x86_64 macOS is not a hosted job. See the README.
  # A queued arm64 job that never gets a runner is cancelled after about
  # 15 minutes ("not acquired by Runner of type hosted"). That is runner
  # capacity, not a build failure; re-run the job.
  # This job is part of every push and pull_request to next and main.
  # Do not add `if: false`: that condition skipped the job on every PR
  # whose branch did not change this file.
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 5 and GNU userland
        run: brew install bash coreutils findutils gnu-sed
      - name: Cache pinned tcc
        id: tcc
        uses: actions/cache@v4
        with:
          path: |
            third_party/tcc
            third_party/tinycc
          key: tcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tcc.sh', 'third_party/patches/tinycc-macos-tbd-reexports.patch') }}
      - name: Build pinned tcc
        if: steps.tcc.outputs.cache-hit != 'true'
        run: scripts/build-tcc.sh
      - name: Install rustc 1.99
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
            # shellcheck disable=SC1091
            source "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup set profile minimal
          rustup toolchain install 1.99.0
          rustup default 1.99.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Run CI gate
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/third_party/tcc
          LUST_GATE_FILTER: ${{ github.event.inputs.gate_filter }}
        run: bash scripts/ci.sh
      - name: Publish gate failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/publish-ci-failures.sh
      - name: Upload gate failure list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failures-macos
          path: ci-failures.txt
          if-no-files-found: ignore
