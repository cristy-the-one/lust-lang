name: Release packages

# Builds the Linux tarball and the Windows zip and uploads them as workflow
# artifacts. It does not publish a GitHub Release. Run it by hand from the
# Actions tab (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install rustc 1.99
        run: |
          rustup set profile minimal
          rustup toolchain install 1.99.0
          rustup default 1.99.0
      - name: Build pinned tcc
        run: scripts/build-tcc.sh
      - name: Pack the Linux tarball
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/third_party/tcc
        run: scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lust-x86_64-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustc 1.99
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Pack the Windows zip
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: lust-x86_64-windows
          path: |
            dist/*.zip
            dist/*.sha256
