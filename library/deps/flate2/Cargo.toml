# Lust adapter crate (docs/ARCH.md section 3.6). Dev builds compile this
# crate in place of the registry package flate2 1.1.10; release builds
# use the real crate through Cargo. The driver checks `version` against
# the resolved package and the metadata against src/resolve/adapters.rs.
[package]
name = "flate2"
version = "1.1.10"
edition = "2024"
publish = false

[package.metadata.lust]
adapter = 1
# The read side over the adapter's own inflate, and write::GzEncoder,
# write::ZlibEncoder, and write::DeflateEncoder over a copy of miniz_oxide
# 0.9.1's deflate (the rust_backend compressor). The backend feature names
# change nothing in this surface. The bufread module is not here.
features = ["default", "rust_backend", "any_impl", "miniz_oxide", "runtime_detection"]
